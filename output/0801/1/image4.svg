<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, 'Malgun Gothic', system-ui, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0%" stop-color="#0f1f3d"/><stop offset="100%" stop-color="#0a1428"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#ffc83d" stop-opacity="0.16"/><stop offset="100%" stop-color="#ffc83d" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1080" fill="url(#bg)"/><circle cx="1040" cy="-40" r="620" fill="url(#glow)"/><rect x="88" y="96" width="8" height="72" rx="4" fill="#ffc83d"/><text x="122" y="146" font-size="38" fill="#a9b6cc">오늘의 정리</text><text x="88" y="268" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">이것만 기억하면</text><text x="88" y="352" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">충분합니다</text><circle cx="118" cy="478" r="30" fill="#ffc83d" opacity="0.18"/><text x="118" y="492" font-size="34" font-weight="800" fill="#ffc83d" text-anchor="middle">1</text><text x="172" y="494" font-size="44" font-weight="600" fill="#ffffff">수출 989억 달러는 역대 2위,</text><text x="172" y="552" font-size="44" font-weight="600" fill="#ffffff">그중 41%가 반도체</text><circle cx="118" cy="650" r="30" fill="#ffc83d" opacity="0.18"/><text x="118" y="664" font-size="34" font-weight="800" fill="#ffc83d" text-anchor="middle">2</text><text x="172" y="666" font-size="44" font-weight="600" fill="#ffffff">에너지 수입이 50% 늘어</text><text x="172" y="724" font-size="44" font-weight="600" fill="#ffffff">흑자는 생각보다 얇다</text><circle cx="118" cy="822" r="30" fill="#ffc83d" opacity="0.18"/><text x="118" y="836" font-size="34" font-weight="800" fill="#ffc83d" text-anchor="middle">3</text><text x="172" y="838" font-size="44" font-weight="600" fill="#ffffff">반도체 밖 업종은</text><text x="172" y="896" font-size="44" font-weight="600" fill="#ffffff">체감까지 시차가 있다</text><text x="88" y="1016" font-size="32" fill="#7f8da3">자료 : 산업통상부 7월 수출입동향</text></svg>